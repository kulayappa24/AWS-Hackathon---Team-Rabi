# PostgreSQL Production / Docker profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbg_member_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sbg_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sbg_secure_password_2026}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
