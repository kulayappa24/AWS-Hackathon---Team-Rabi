spring.application.name=club-member-portal
server.port=${PORT:5000}

# Spring Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Document Ingestion Settings
app.rag.documents-path=${DOCUMENTS_DIRECTORY_PATH:../documents}
app.rag.similarity-threshold=0.25
app.rag.top-k-results=3

# Fallback Information from 01-onboarding-faq.md
app.rag.fallback.leader-name=Shanmukha Sasi Sadineni
app.rag.fallback.leader-role=AWS Student Builder Group Leader
app.rag.fallback.leader-email=sadinenisasi@gmail.com
app.rag.fallback.leader-phone=7396025334
app.rag.fallback.tech-lead-name=Revan Kumar Goud Bommagoni
app.rag.fallback.tech-lead-email=brevankumargoud@gmail.com

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.reset-token-expiration-minutes=${JWT_RESET_TOKEN_EXPIRATION_MINUTES:30}

# AI Provider ('local' or 'bedrock')
app.ai.provider=${AI_PROVIDER:local}
app.ai.aws.region=${AWS_REGION:us-east-1}
app.ai.aws.model-id=${AWS_BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}

# Mail Configuration (Supports Amazon SES Native SDK & SMTP)
app.mail.provider=${MAIL_PROVIDER:ses}
app.mail.from=${MAIL_FROM:o220581@rguktong.ac.in}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
